"$schema" = 'https://starship.rs/config-schema.json'

# Two-line prompt with box-drawing connectors, matching the old p10k config:
#   ╭─  os  dir  git                     status  time ─╮
#   ╰─ ❯
#
# Colours are the same ANSI numbers p10k used.
# Each right-hand segment is a self-contained pill. Modules come and go, so
# chained powerline arrows would leave stray separators behind.

format = """
[╭─](fg:240)\
[](fg:7)[$os](fg:232 bg:7)[](fg:7 bg:4)\
[ $directory ](fg:254 bg:4)[](fg:4)\
$git_branch\
$git_status\
$fill\
$python\
$cmd_duration\
$jobs\
$status\
$username$hostname\
$time\
[─╮](fg:240)
[╰─](fg:240)$character"""

add_newline = true

[fill]
symbol = ' '
style = 'fg:240'

[os]
disabled = false
format = ' $symbol '

[os.symbols]
Ubuntu = ''
Debian = ''
Macos = ''
Linux = ''
Arch = ''
Raspbian = ''

[directory]
format = '$path$read_only'
truncation_length = 3
truncate_to_repo = false
fish_style_pwd_dir_length = 1
truncation_symbol = '…/'
read_only = '  '
home_symbol = '~'

[git_branch]
format = '[](fg:2)[ $symbol$branch ](fg:0 bg:2)[](fg:2) '
symbol = ' '

[git_status]
# Dirty state shows as glyphs on a yellow pill, the way p10k switched
# the vcs segment from green to yellow.
format = '([](fg:3)[ $all_status$ahead_behind](fg:0 bg:3)[](fg:3))'
conflicted = '~${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = '?${count} '
stashed = '*${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '✘${count} '

[python]
format = '[](fg:4)[ $symbol$virtualenv ](fg:254 bg:4)[](fg:4) '
symbol = ' '
# Only announce an active virtualenv, not every .py file in sight.
detect_extensions = []
detect_files = []
detect_folders = []

[cmd_duration]
min_time = 3_000
format = '[](fg:3)[ 󱎫 $duration ](fg:0 bg:3)[](fg:3) '

[jobs]
format = '[](fg:6)[ $symbol$number ](fg:0 bg:6)[](fg:6) '
symbol = ' '
number_threshold = 1

[status]
disabled = false
format = '[](fg:1)[ $symbol$status ](fg:7 bg:1)[](fg:1) '
symbol = '✘ '
sigint_symbol = '󰂭 '
signal_symbol = '⚡ '
map_symbol = true

[username]
show_always = true
format = '[](fg:0)[ $user](fg:3 bg:0)'
style_user = 'fg:3 bg:0'
style_root = 'fg:1 bg:0 bold'

[hostname]
ssh_only = false
format = '[@$hostname ](fg:3 bg:0)[](fg:0) '
# Ghostty marks the shell prompt itself, so no extra ssh symbol is needed.
ssh_symbol = ''

[time]
disabled = false
time_format = '%I:%M:%S %p'
format = '[](fg:7)[ $time ](fg:0 bg:7)[](fg:7)'

[character]
success_symbol = '[❯](bold fg:76)'
error_symbol = '[❯](bold fg:196)'
vicmd_symbol = '[❮](bold fg:76)'
