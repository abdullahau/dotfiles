# tokyo-night, modified. The left bar is the preset's own, untouched
# apart from time, which moved right.
# Right: exit code, run time, then user@host flowing into the clock.
# Input sits on line two, as the preset already did.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#a3aed2)\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#212736)\
$fill\
$status\
$cmd_duration\
$username\
$hostname\
$time\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[bun]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[time]
disabled = false
time_format = "%R"
format = '[  $time ](fg:#a0a9cb bg:#1d2230)[](fg:#1d2230)'

[username]
show_always = true
style_user = "bg:#394260 fg:#a0a9cb"
style_root = "bg:#394260 fg:#f7768e bold"
format = '[](fg:#394260)[ $user]($style)'

[hostname]
ssh_only = false
ssh_symbol = ""
format = '[@$hostname ](bg:#394260 fg:#a0a9cb)[](fg:#1d2230 bg:#394260)'

[status]
disabled = false
map_symbol = true
symbol = "✘ "
sigint_symbol = "󰂭 "
signal_symbol = "⚡ "
format = '[](fg:#f7768e)[ $symbol$status ](bg:#f7768e fg:#1a1b26)[](fg:#f7768e) '

[cmd_duration]
disabled = false
min_time = 2_000
show_milliseconds = false
format = '[](fg:#e0af68)[  $duration ](bg:#e0af68 fg:#1a1b26)[](fg:#e0af68) '

[fill]
symbol = " "
style = "fg:#212736"

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
