# tokyo-night, modified.
# Left: the preset's own bar, minus time. Languages share the git slot,
# so no empty box trails the bar where the clock used to sit.
# Right: one connected bar - exit code, run time, user@host, clock.

"$schema" = 'https://starship.rs/config-schema.json'

# starship shells out to git and gives up after 500 ms by default, then
# draws nothing at all: no branch, no counts, no ahead marker. Raise the
# ceiling so a big repo still reports. It is a limit, not a delay, so a
# fast repo is unaffected.
command_timeout = 1000

format = """
[░▒▓](#a3aed2)\
$os\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#394260)\
$fill\
[](fg:#394260)\
$status\
$cmd_duration\
$username\
$hostname\
[](fg:#1d2230 bg:#394260)\
$time\
[](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind)](fg:#769ff0 bg:#394260)]($style)'
conflicted = "~${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = "*${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[nodejs]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#394260)]($style)'

[bun]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#394260)]($style)'

[rust]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#394260)]($style)'

[golang]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#394260)]($style)'

[php]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#394260)]($style)'

[time]
disabled = false
time_format = "%R"
format = '[  $time ](fg:#a0a9cb bg:#1d2230)'

[username]
show_always = true
style_user = "bg:#394260 fg:#a0a9cb"
style_root = "bg:#394260 fg:#f7768e bold"
format = '[ $user]($style)'

[hostname]
ssh_only = false
ssh_symbol = ""
format = '[@$hostname ](bg:#394260 fg:#a0a9cb)'

[status]
disabled = false
map_symbol = true
symbol = "✘ "
sigint_symbol = "󰂭 "
signal_symbol = "⚡ "
format = '[ $symbol$status](bg:#394260 fg:#f7768e)'

[cmd_duration]
disabled = false
min_time = 1_000
show_milliseconds = false
format = '[  $duration](bg:#394260 fg:#e0af68)'

[fill]
symbol = " "
style = "fg:#394260"

[os]
style = "bg:#a3aed2 fg:#090c0c"
format = "[ $symbol ]($style)"
disabled = false

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[character]
# Verified at 3:1 or better against a light terminal (#eff1f5) and a dark one
# (#1e1e2e). Every pastel green fails one or the other.
success_symbol = '[❯](bold fg:#1a9850)'
error_symbol = '[❯](bold fg:#d20f39)'
vimcmd_symbol = '[❮](bold fg:#1a9850)'
