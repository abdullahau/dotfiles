- defaults:
    link:
      relink: true

- clean: ["~", "~/.config"]

- create:
   - ~/Developer
   - ~/.config

- link:
    # Shell
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv
    ~/.p10k.zsh: zsh/p10k.zsh
    ~/.inputrc: zsh/inputrc
    ~/.zfunc: zsh/zfunc
    # Git
    ~/.gitconfig: git/gitconfig
    ~/.gitignore_global: git/gitignore_global
    # Terminal Packages & App Configs
    ~/.config/micro: micro
    ~/.config/yazi: yazi
    ~/.config/bat: bat
    ~/.config/btop: btop
    ~/.config/zellij: zellij
    ~/.config/atuin: atuin
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    # SSH
    ~/.ssh/config: ssh/config
    # Linters
    ~/.config/codebook: codebook
    ~/.config/ruff: ruff

- shell:
  # Pull every submodule to the commit this repo pins. z4h installs its own
  # plugins into ~/.cache/zsh4humans, so nothing else is vendored here.
  - command: git submodule update --init --recursive
    stdin: true
    stdout: true
    stderr: true
  - command: sudo apt-get update && sudo apt-get install -y zsh
    stdin: true
    stdout: true
    stderr: true
  - command: [chsh -s $(which zsh), Making zsh the default shell]
    stdin: true
    stdout: true
    stderr: true
  - command: ./setup_ubuntu.zsh
    stdin: true
    stdout: true
    stderr: true
  - command: ./setup_homebrew.zsh
    stdin: true
    stdout: true
    stderr: true
  - command: ./setup_docker.zsh
    stdin: true
    stdout: true
    stderr: true
  - command: ./vps/relay.sh
    stdin: true
    stdout: true
    stderr: true
  - command: ./vps/local-ports.sh
    stdin: true
    stdout: true
    stderr: true
  - command: ./setup_bbr.sh
    stdin: true
    stdout: true
    stderr: true
