- defaults:
    link:
      relink: true

- clean: ["~", "~/.config"]

- create:
   - ~/Developer
   - ~/.config

- link:
    # Shell. starship is the default on this branch.
    ~/.zshrc: zsh-next/zshrc
    ~/.zshenv: zsh-next/zshenv
    ~/.config/starship: zsh-next/starship
    ~/.inputrc: zsh/inputrc
    ~/.zfunc: zsh/zfunc
    # z4h fallback, kept while starship is on trial. Launch it with:
    #   ZDOTDIR=~/.config/zsh-z4h zsh
    ~/.config/zsh-z4h/.zshrc:
      path: zsh/zshrc
      create: true
    ~/.config/zsh-z4h/.zshenv:
      path: zsh/zshenv
      create: true
    ~/.config/zsh-z4h/.p10k.zsh:
      path: zsh/p10k.zsh
      create: true
    # Update APT
    ~/update_os.sh: update_os.sh
    # Git
    ~/.gitconfig: git/gitconfig
    ~/.gitignore_global: git/gitignore_global
    # Configurations
    # Terminal Packages & Apps
    ~/.config/micro: micro
    ~/.config/yazi: yazi
    ~/.config/bat: bat
    ~/.config/fastfetch: fastfetch
    ~/.config/btop: btop
    ~/.config/atuin: atuin
    ~/.config/zellij: zellij
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    # SSH
    ~/.ssh/config: ssh/config
    # Linters
    ~/.config/codebook: codebook
    ~/.config/ruff: ruff

- shell:
  - command: sudo apt-get update && sudo apt-get install -y zsh
    stdin: true
    stdout: true
    stderr: true
  - command: [chsh -s $(which zsh), Making zsh the default shell]
    stdin: true
    stdout: true
    stderr: true
  - command: ./setup_ubuntu.zsh
    stdin: true
    stdout: true
    stderr: true
  - command: ./setup_homebrew.zsh
    stdin: true
    stdout: true
    stderr: true
  - command: ./setup_docker.zsh
    stdin: true
    stdout: true
    stderr: true
  - command: ./setup_rclone.zsh
    stdin: true
    stdout: true
    stderr: true
