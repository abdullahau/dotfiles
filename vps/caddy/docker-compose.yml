# Reference copy — the live one runs from ~/Developer/home/deploy/, where
# ../public and ../media actually resolve. Running `docker compose up` from
# here will fail (paths don't exist here, and 80/443 are already bound).
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../public:/srv:ro
      - ../media:/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
